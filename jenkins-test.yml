name: Student Registration Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test HTML file
        run: |
          test -f index.html
          grep -q "<form" index.html
          grep -q "Student Name" index.html
          grep -q "Course" index.html
          grep -q "Feedback" index.html
          echo "All required elements found!"
